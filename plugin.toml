# Switcher: jump to any window on niri by typing its label.
#
# Every window is labelled with one or two letters (helix goto_word
# style): its app name's first letter, or two letters when windows share
# it. Typing a label focuses that window. Two panels show the labels: a
# compact list of app names, and a minimap of every monitor's workspaces
# with their windows as tiles; Space switches between them. Bound to
# rcmd+letter in niri, the service focuses a window straight away when the
# letter is a whole label, and opens the list when it starts several.

id = "filedesless/switcher"
name = "Switcher"
version = "0.1.0"
plugin_api = 26
author = "filedesless"
license = "MIT"
icon = "layout-grid"
description = "Jump to any niri window from a minimap of all workspaces by typing its label, taken from the app's name."
tags = ["panel", "service", "niri", "productivity"]
dependencies = ["niri", "grim"]

# Letters labels may use, best first: second letters, and first letters
# for names that have none of them.
[[setting]]
key = "hint_chars"
type = "string"
label_key = "settings.hint_chars.label"
description_key = "settings.hint_chars.description"
default = "asdfghjklqwertyuiopzxcvbnm"

# Window previews: grim captures windows while they're on screen, and the
# panel shows the last capture.
[[setting]]
key = "previews"
type = "bool"
label_key = "settings.previews.label"
description_key = "settings.previews.description"
default = true

# niri's layout gaps (its default is 16), to work out where tiled windows
# are on screen.
[[setting]]
key = "gaps"
type = "int"
label_key = "settings.gaps.label"
description_key = "settings.gaps.description"
default = 16
min = 0
max = 64

# The minimap. Sizes must match switcher.luau's PANEL_W/H.
[[panel]]
id = "panel"
entry = "panel.luau"
width = 1400
height = 880
placement = "floating"
position = "center"
keyboard_focus = "exclusive"
capture_keys = [
  "a", "b", "c", "d", "e", "f", "g", "h", "i", "j", "k", "l", "m",
  "n", "o", "p", "q", "r", "s", "t", "u", "v", "w", "x", "y", "z",
  "space", "backspace", "escape",
]

# The compact list: labels and app names. Sizes must match switcher.luau's
# COMPACT_W/H.
[[panel]]
id = "compact"
entry = "compact.luau"
width = 560
height = 520
placement = "floating"
position = "center"
keyboard_focus = "exclusive"
capture_keys = [
  "a", "b", "c", "d", "e", "f", "g", "h", "i", "j", "k", "l", "m",
  "n", "o", "p", "q", "r", "s", "t", "u", "v", "w", "x", "y", "z",
  "space", "backspace", "escape",
]

# Keeps a live copy of niri's windows and workspaces (from its event
# stream) in "switcher.snapshot", so the panels open without waiting on IPC.
# Bind its "key" event to rcmd+letter and rcmd+Space in niri:
#   noctalia msg plugin filedesless/switcher:service all key <letter|space>
[[service]]
id = "service"
entry = "service.luau"
